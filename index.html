<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Writer with Vercel & MongoDB</title>
    
    <!-- ⚠️ CDN Stylesheets removed for safety. We handle styles in style.css directly -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Intro Writer</h1>
        <p>Create a short introduction about yourself.</p>

        <form id="profileForm" onsubmit="return false;">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="John Doe">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="john@example.com">

            <label for="website">Portfolio / Website</label>
            <input type="url" id="website" placeholder="https://example.com">

            <label for="location">Detected Residence Location</label>
            <input type="text" id="location" placeholder="Detecting location..." readonly>

            <label for="intro">Your Introduction</label>
            <textarea id="intro" maxlength="250" placeholder="Tell us about yourself..."></textarea>
            <div id="counter">250 characters remaining</div>

            <div class="buttons">
                <button type="button" id="previewBtn">Generate Preview & Save</button>
                <button type="button" id="clearBtn" class="secondary">Clear</button>
            </div>
        </form>
    </div>

    <!-- Dynamic Live Map Container -->
        <!-- Dynamic Live Map Container -->
    <div class="container">
        <h2>Residence Map Location</h2>
        <div id="map-image-wrapper">
            <!-- 📁 This replaces the iframe with a lightweight image tag -->
            <img id="map-static-img" src="" alt="Loading map positioning..." style="width:100%; height:100%; object-fit:cover; display:none;">
            <div id="map-loader-text" style="padding: 20px; color: #666; text-align: center;">Centering map...</div>
        </div>
    </div>


    <div class="preview">
        <h2>Preview</h2>
        <p><strong>Name:</strong> <span id="previewName">-</span></p>
        <p><strong>Email:</strong> <span id="previewEmail">-</span></p>
        <p><strong>Website:</strong> <a id="previewWebsite" target="_blank">-</a></p>
        <p><strong>Location:</strong> <span id="previewLocation">-</span></p>
        <p><strong>Introduction:</strong></p>
        <div id="previewIntro" class="introBox">Your introduction will appear here.</div>
    </div>

    <!-- ⚠️ Only your local, secure script.js is called now -->
    <script src="script.js"></script>
</body>
</html>
